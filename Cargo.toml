[package]
name = "word-to-code"
version = "0.1.0"
edition = "2021"
description = "Convert lists of words to array literals in multiple programming languages"
authors = ["ItzzMateo"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ItzzMateo/WordToCode"
keywords = ["converter", "words", "array", "code-generation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "word-to-code"
path = "src/main.rs"

[[bin]]
name = "wtc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
arboard = "3.4"
libc = "0.2"

[features]
default = ["cli"]
cli = []
gui = ["dep:eframe"]

[dependencies.eframe]
version = "0.29"
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
